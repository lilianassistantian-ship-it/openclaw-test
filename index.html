<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw Work Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #21262d;
            --border: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #238636;
            --accent-yellow: #9e6a03;
            --accent-gray: #6e7681;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
            position: relative;
        }
        
        .last-updated {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .refresh-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .refresh-btn:hover {
            background: #79c0ff;
            transform: translateY(-1px);
        }
        
        .refresh-btn:disabled {
            background: var(--accent-gray);
            cursor: not-allowed;
            transform: none;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .subtitle {
            color: var(--text-secondary);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-card h3 {
            font-size: 2rem;
            color: var(--accent-blue);
        }
        
        .stat-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .column {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            min-height: 400px;
        }
        
        .column h2 {
            font-size: 1.1rem;
            padding-bottom: 15px;
            border-bottom: 3px solid;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .column.done h2 { border-color: var(--accent-green); }
        .column.in-progress h2 { border-color: var(--accent-yellow); }
        .column.backlog h2 { border-color: var(--accent-gray); }
        
        .item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .item:hover {
            border-color: var(--accent-blue);
            transform: translateY(-2px);
        }
        
        .item-title {
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        
        .item-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        
        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .tag.integration { background: #8957e5; color: white; }
        .tag.infrastructure { background: #1f6feb; color: white; }
        .tag.tracking { background: #d29922; color: black; }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .error {
            background: #da3633;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .last-updated {
            text-align: center;
            margin-top: 40px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            padding: 25px;
            position: relative;
        }
        
        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        .modal h3 {
            color: var(--accent-blue);
            margin-bottom: 15px;
            padding-right: 30px;
        }
        
        .modal-body {
            color: var(--text-primary);
            line-height: 1.6;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }
        
        .modal-meta {
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }
        
        @media (max-width: 768px) {
            .board { grid-template-columns: 1fr; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🦞 OpenClaw Work Tracker</h1>
            <p class="subtitle">Real-time project status for Kimi Claw AI Assistant</p>
            <div class="last-updated">
                <span id="timestamp">Loading...</span>
                <button class="refresh-btn" onclick="requestUpdate()">🔄 Request Update</button>
            </div>
        </header>

        <div class="stats">
            <div class="stat-card">
                <h3 id="backlog-count">-</h3>
                <p>Backlog</p>
            </div>
            <div class="stat-card">
                <h3 id="progress-count">-</h3>
                <p>In Progress</p>
            </div>
            <div class="stat-card">
                <h3 id="done-count">-</h3>
                <p>Completed</p>
            </div>
            <div class="stat-card">
                <h3 id="total-count">-</h3>
                <p>Total Tasks</p>
            </div>
        </div>

        <div id="error-container"></div>

        <div class="board">
            <div class="column backlog">
                <h2>📋 Backlog</h2>
                <div id="backlog-items"><div class="loading">Loading...</div></div>
            </div>
            <div class="column in-progress">
                <h2>🔄 In Progress</h2>
                <div id="progress-items"><div class="loading">Loading...</div></div>
            </div>
            <div class="column done">
                <h2>✅ Done</h2>
                <div id="done-items"><div class="loading">Loading...</div></div>
            </div>
        </div>

        <div class="last-updated">
            Last updated: <span id="timestamp">-</span>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h3 id="modal-title"></h3>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-meta" id="modal-meta"></div>
        </div>
    </div>

    <script>
        // GitHub config - using token for private repo access
        const REPO_OWNER = 'lilianassistantian-ship-it';
        const REPO_NAME = 'openclaw-test';
        
        let currentIssues = [];

        async function fetchIssues() {
            try {
                // Try without token first (for public), fallback will handle private
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues?state=all&per_page=100`);
                
                if (!response.ok) {
                    if (response.status === 404 || response.status === 403) {
                        throw new Error('Repository is private or not accessible');
                    }
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const issues = await response.json();
                currentIssues = issues;
                renderBoard(issues);
                updateStats(issues);
                updateTimestamp();
                clearError();
            } catch (error) {
                console.error('Error fetching issues:', error);
                showError('Unable to load from GitHub. The repository may be private or the API rate limit was reached. Using cached data if available.');
                loadFallbackData();
            }
        }

        function getColumnFromLabels(labels) {
            const labelNames = labels.map(l => l.name.toLowerCase());
            if (labelNames.includes('done')) return 'done';
            if (labelNames.includes('in-progress')) return 'in-progress';
            return 'backlog';
        }

        function getTagFromLabels(labels) {
            const labelMap = {
                'infrastructure': 'infrastructure',
                'integration': 'integration',
                'tracking': 'tracking'
            };
            for (const label of labels) {
                const name = label.name.toLowerCase();
                if (labelMap[name]) return labelMap[name];
            }
            return 'backlog';
        }

        function renderBoard(issues) {
            const columns = {
                backlog: [],
                'in-progress': [],
                done: []
            };

            issues.forEach(issue => {
                const column = getColumnFromLabels(issue.labels);
                const tag = getTagFromLabels(issue.labels);
                columns[column].push({
                    id: issue.number,
                    title: issue.title,
                    body: issue.body || 'No description provided.',
                    date: new Date(issue.created_at).toLocaleDateString(),
                    tag: tag,
                    url: issue.html_url
                });
            });

            renderItems('backlog-items', columns.backlog);
            renderItems('progress-items', columns['in-progress']);
            renderItems('done-items', columns.done);
        }

        function renderItems(containerId, items) {
            const container = document.getElementById(containerId);
            if (items.length === 0) {
                container.innerHTML = '<div class="loading">No items</div>';
                return;
            }
            container.innerHTML = items.map(item => `
                <div class="item" onclick="openModal(${item.id})">
                    <div class="item-title">${escapeHtml(item.title)}</div>
                    <div class="item-meta">#${item.id} • ${item.date}</div>
                    <span class="tag ${item.tag}">${item.tag}</span>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function openModal(issueId) {
            const issue = currentIssues.find(i => i.number === issueId);
            if (!issue) return;

            document.getElementById('modal-title').textContent = issue.title;
            document.getElementById('modal-body').textContent = issue.body || 'No description provided.';
            document.getElementById('modal-meta').innerHTML = `
                Issue #${issue.number} • ${new Date(issue.created_at).toLocaleString()}<br>
                <a href="${issue.html_url}" target="_blank" style="color: #58a6ff;">View on GitHub →</a>
            `;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function updateStats(issues) {
            const counts = { backlog: 0, 'in-progress': 0, done: 0 };
            issues.forEach(issue => {
                const column = getColumnFromLabels(issue.labels);
                counts[column]++;
            });
            document.getElementById('backlog-count').textContent = counts.backlog;
            document.getElementById('progress-count').textContent = counts['in-progress'];
            document.getElementById('done-count').textContent = counts.done;
            document.getElementById('total-count').textContent = issues.length;
        }

        function updateTimestamp() {
            document.getElementById('timestamp').textContent = new Date().toLocaleString();
        }

        function showError(message) {
            const container = document.getElementById('error-container');
            container.innerHTML = `<div class="error">${message}</div>`;
        }

        function clearError() {
            document.getElementById('error-container').innerHTML = '';
        }

        function updateTimestamp() {
            const now = new Date();
            const timeString = now.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true,
                timeZoneName: 'short'
            });
            document.getElementById('timestamp').textContent = `Last updated: ${timeString}`;
        }

        function requestUpdate() {
            const btn = document.querySelector('.refresh-btn');
            btn.disabled = true;
            btn.textContent = '⏳ Requesting...';
            
            // In a real implementation, this would trigger a webhook or API call
            // For now, just refresh the data
            setTimeout(() => {
                fetchIssues();
                btn.disabled = false;
                btn.textContent = '🔄 Request Update';
            }, 1000);
        }

        function loadFallbackData() {
            // Static fallback data
            const fallback = [
                { number: 1, title: "✅ OpenClaw updated to v2026.2.14", body: "Updated to latest version", created_at: new Date().toISOString(), labels: [{name: 'done'}, {name: 'infrastructure'}], html_url: '#' },
                { number: 2, title: "✅ Telegram bot configured", body: "Bot configured and paired", created_at: new Date().toISOString(), labels: [{name: 'done'}, {name: 'integration'}], html_url: '#' },
                { number: 3, title: "✅ Gmail integration (gog)", body: "OAuth complete", created_at: new Date().toISOString(), labels: [{name: 'done'}, {name: 'integration'}], html_url: '#' },
                { number: 4, title: "🔄 Build kanban tracker system", body: "In progress", created_at: new Date().toISOString(), labels: [{name: 'in-progress'}, {name: 'tracking'}], html_url: '#' },
                { number: 5, title: "📋 Twitter/X monitoring setup", body: "Backlog", created_at: new Date().toISOString(), labels: [{name: 'backlog'}, {name: 'integration'}], html_url: '#' }
            ];
            currentIssues = fallback;
            renderBoard(fallback);
            updateStats(fallback);
            updateTimestamp();
        }

        document.addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        fetchIssues();
        setInterval(fetchIssues, 300000);
    </script>
</body>
</html>
