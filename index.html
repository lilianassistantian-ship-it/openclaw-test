<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw Work Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            line-height: 1.6;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #30363d;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #58a6ff;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .header p {
            color: #8b949e;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        .stat-card h3 {
            font-size: 2rem;
            color: #58a6ff;
        }
        .stat-card p {
            color: #8b949e;
            font-size: 0.9rem;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .column {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            min-height: 200px;
        }
        .column h2 {
            color: #f0f6fc;
            font-size: 1.1rem;
            padding-bottom: 10px;
            border-bottom: 2px solid;
            margin-bottom: 15px;
        }
        .column.done h2 { border-color: #238636; }
        .column.in-progress h2 { border-color: #9e6a03; }
        .column.backlog h2 { border-color: #8b949e; }
        .item {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .item:hover {
            border-color: #58a6ff;
            transform: translateY(-2px);
        }
        .item-title {
            font-weight: 600;
            margin-bottom: 5px;
        }
        .item-meta {
            font-size: 0.8rem;
            color: #8b949e;
        }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-top: 8px;
            margin-right: 5px;
        }
        .tag.infra { background: #1f6feb; color: white; }
        .tag.integration { background: #8957e5; color: white; }
        .tag.tracking { background: #d29922; color: black; }
        .tag.done { background: #238636; color: white; }
        .tag.in-progress { background: #9e6a03; color: white; }
        .tag.backlog { background: #6e7681; color: white; }
        .loading {
            text-align: center;
            color: #8b949e;
            padding: 20px;
        }
        .error {
            background: #da3633;
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .last-updated {
            text-align: center;
            margin-top: 40px;
            color: #6e7681;
            font-size: 0.85rem;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            padding: 25px;
            position: relative;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #8b949e;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .modal-close:hover {
            color: #f0f6fc;
        }
        .modal h3 {
            color: #58a6ff;
            margin-bottom: 15px;
            padding-right: 30px;
        }
        .modal-body {
            color: #c9d1d9;
            line-height: 1.6;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }
        .modal-meta {
            color: #8b949e;
            font-size: 0.85rem;
            border-top: 1px solid #30363d;
            padding-top: 15px;
        }
        @media (max-width: 768px) {
            .board { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🦞 OpenClaw Work Tracker</h1>
        <p>Real-time project status for Kimi Claw AI Assistant</p>
    </div>

    <div class="stats">
        <div class="stat-card">
            <h3 id="backlog-count">-</h3>
            <p>Backlog</p>
        </div>
        <div class="stat-card">
            <h3 id="progress-count">-</h3>
            <p>In Progress</p>
        </div>
        <div class="stat-card">
            <h3 id="done-count">-</h3>
            <p>Completed</p>
        </div>
        <div class="stat-card">
            <h3 id="total-count">-</h3>
            <p>Total Tasks</p>
        </div>
    </div>

    <div class="board">
        <div class="column backlog">
            <h2>📋 Backlog</h2>
            <div id="backlog-items"><div class="loading">Loading...</div></div>
        </div>
        <div class="column in-progress">
            <h2>🔄 In Progress</h2>
            <div id="progress-items"><div class="loading">Loading...</div></div>
        </div>
        <div class="column done">
            <h2>✅ Done</h2>
            <div id="done-items"><div class="loading">Loading...</div></div>
        </div>
    </div>

    <div class="last-updated">
        Last updated: <span id="timestamp">-</span>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h3 id="modal-title"></h3>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-meta" id="modal-meta"></div>
        </div>
    </div>

    <script>
        const REPO_OWNER = 'lilianassistantian-ship-it';
        const REPO_NAME = 'openclaw-test';
        
        let currentIssues = [];

        async function fetchIssues() {
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues?state=all&per_page=100`);
                if (!response.ok) throw new Error('Failed to fetch issues');
                const issues = await response.json();
                currentIssues = issues;
                renderBoard(issues);
                updateStats(issues);
                updateTimestamp();
            } catch (error) {
                console.error('Error fetching issues:', error);
                showError('Failed to load issues from GitHub. Using fallback data.');
                loadFallbackData();
            }
        }

        function getColumnFromLabels(labels) {
            const labelNames = labels.map(l => l.name.toLowerCase());
            if (labelNames.includes('done')) return 'done';
            if (labelNames.includes('in-progress')) return 'in-progress';
            return 'backlog';
        }

        function getTagFromLabels(labels) {
            const labelMap = {
                'infrastructure': 'infra',
                'integration': 'integration',
                'tracking': 'tracking'
            };
            for (const label of labels) {
                const name = label.name.toLowerCase();
                if (labelMap[name]) return labelMap[name];
            }
            return 'backlog';
        }

        function renderBoard(issues) {
            const columns = {
                backlog: [],
                'in-progress': [],
                done: []
            };

            issues.forEach(issue => {
                const column = getColumnFromLabels(issue.labels);
                const tag = getTagFromLabels(issue.labels);
                columns[column].push({
                    id: issue.number,
                    title: issue.title,
                    body: issue.body || 'No description provided.',
                    date: new Date(issue.created_at).toLocaleDateString(),
                    tag: tag,
                    url: issue.html_url,
                    state: issue.state
                });
            });

            renderItems('backlog-items', columns.backlog);
            renderItems('progress-items', columns['in-progress']);
            renderItems('done-items', columns.done);
        }

        function renderItems(containerId, items) {
            const container = document.getElementById(containerId);
            if (items.length === 0) {
                container.innerHTML = '<div class="loading">No items</div>';
                return;
            }
            container.innerHTML = items.map(item => `
                <div class="item" onclick="openModal(${item.id})">
                    <div class="item-title">${escapeHtml(item.title)}</div>
                    <div class="item-meta">#${item.id} • ${item.date}</div>
                    <span class="tag ${item.tag}">${item.tag}</span>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function openModal(issueId) {
            const issue = currentIssues.find(i => i.number === issueId);
            if (!issue) return;

            document.getElementById('modal-title').textContent = issue.title;
            document.getElementById('modal-body').textContent = issue.body || 'No description provided.';
            document.getElementById('modal-meta').innerHTML = `
                Issue #${issue.number} • ${new Date(issue.created_at).toLocaleString()}<br>
                Status: ${issue.state} • <a href="${issue.html_url}" target="_blank" style="color: #58a6ff;">View on GitHub →</a>
            `;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function updateStats(issues) {
            const counts = { backlog: 0, 'in-progress': 0, done: 0 };
            issues.forEach(issue => {
                const column = getColumnFromLabels(issue.labels);
                counts[column]++;
            });
            document.getElementById('backlog-count').textContent = counts.backlog;
            document.getElementById('progress-count').textContent = counts['in-progress'];
            document.getElementById('done-count').textContent = counts.done;
            document.getElementById('total-count').textContent = issues.length;
        }

        function updateTimestamp() {
            document.getElementById('timestamp').textContent = new Date().toLocaleString();
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = message;
            document.querySelector('.header').after(errorDiv);
        }

        function loadFallbackData() {
            // Static fallback data if GitHub API fails
            const fallback = {
                backlog: [
                    { id: 1, title: "Twitter/X monitoring setup", body: "Set up automated monitoring of Twitter/X for OpenClaw updates", date: "2026-02-16", tag: "integration" },
                    { id: 2, title: "Heartbeat checks", body: "Implement periodic heartbeat checks for system health", date: "2026-02-16", tag: "infra" }
                ],
                'in-progress': [
                    { id: 3, title: "Build kanban tracker system", body: "Creating comprehensive project tracking system", date: "2026-02-16", tag: "tracking" }
                ],
                done: [
                    { id: 4, title: "OpenClaw updated to v2026.2.14", body: "Updated to latest version", date: "2026-02-16", tag: "infra" },
                    { id: 5, title: "Telegram bot configured", body: "Bot configured and paired", date: "2026-02-16", tag: "integration" }
                ]
            };
            renderItems('backlog-items', fallback.backlog);
            renderItems('progress-items', fallback['in-progress']);
            renderItems('done-items', fallback.done);
            document.getElementById('backlog-count').textContent = fallback.backlog.length;
            document.getElementById('progress-count').textContent = fallback['in-progress'].length;
            document.getElementById('done-count').textContent = fallback.done.length;
            document.getElementById('total-count').textContent = 5;
        }

        // Close modal on outside click
        document.addEventListener('click', function(e) {
            if (e.target.id === 'modal') closeModal();
        });

        // Close modal on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // Initial load
        fetchIssues();

        // Auto-refresh every 5 minutes
        setInterval(fetchIssues, 300000);
    </script>
</body>
</html>
